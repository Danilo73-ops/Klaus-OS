name: Verify Klaus OS

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/verify.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/restore.sh
      - name: Validate wallpaper XML
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/klaus-night.svg')"
