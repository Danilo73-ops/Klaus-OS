name: Verify Klaus OS

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/**'
      - 'extensions/**'
      - 'assets/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/**'
      - 'extensions/**'
      - 'assets/**'
      - '.github/workflows/verify.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash and Python syntax
        run: |
          bash -n install.sh
          bash -n scripts/restore.sh
          bash -n scripts/plasma/install.sh
          bash -n scripts/plasma/session.sh
          bash -n scripts/plasma/start-test.sh
          bash -n scripts/plasma/start-xfce.sh
          bash -n scripts/plasma/start-vnc.sh
          bash -n scripts/plasma/vnc-session.sh
          bash -n scripts/plasma/apply-theme.sh
          node --check scripts/plasma/klaus-layout.js
          node --check extensions/klaus-auto-video/background.js
          node --check extensions/klaus-auto-video/content.js
          node --check extensions/klaus-auto-video/dashboard.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("extensions/klaus-auto-video")
          m = json.loads((base / "manifest.json").read_text())
          assert m["manifest_version"] == 2
          assert m["background"]["scripts"] == ["background.js"]
          assert m["content_scripts"][0]["js"] == ["content.js"]
          assert "downloads" in m["permissions"]
          for filename in ("background.js", "content.js", "dashboard.js", "dashboard.html", "dashboard.css"):
              assert (base / filename).is_file(), filename
          print("Klaus Auto Video extension structure OK")
          PY
          python3 -m py_compile scripts/wallpaper.py
      - name: Render and inspect wallpaper PNG
        run: |
          python3 scripts/wallpaper.py /tmp/klaus-os-11.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/klaus-os-11.png')
          data=p.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          w,h=struct.unpack('>II',data[16:24])
          assert (w,h)==(1600,720), (w,h)
          assert len(data)>20000, 'empty/invalid wallpaper'
          print('Klaus OS wallpaper OK:',w,h,len(data))
          PY
      - name: Validate legacy SVG
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/klaus-night.svg')"
